name: Refresh build (repo data)

# The Open Source section bakes GitHub repo data (stars, descriptions, last-pushed)
# into the static export at build time, so it only refreshes when something triggers
# a Cloudflare Pages build. Without pushes that data goes stale. This workflow pings a
# Cloudflare Pages *deploy hook* on a schedule to rebuild + redeploy with fresh data.
#
# Manual provisioning (one-time, by the repo owner):
#   1. Cloudflare dashboard → Pages project → Settings → Builds & deployments →
#      Deploy hooks → create a hook (branch: main). Copy the generated URL.
#   2. GitHub → repo Settings → Secrets and variables → Actions → New repository secret
#      named CLOUDFLARE_DEPLOY_HOOK_URL, value = the hook URL.
#   3. Add CLOUDFLARE_API_TOKEN (Pages Read) and CLOUDFLARE_ACCOUNT_ID as
#      repository secrets, plus CLOUDFLARE_PROJECT_NAME as a repository variable.
# The hook URL and API token are credentials, so they remain secrets.
on:
  schedule:
    # Weekly, Mondays at 08:00 UTC. Scheduled runs execute on the default branch.
    - cron: "00 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Rebuild and verify production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Trigger Cloudflare deploy hook
        id: trigger
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::Secret CLOUDFLARE_DEPLOY_HOOK_URL is not set — create the Cloudflare deploy hook and add it as a repo secret (see workflow header)."
            exit 1
          fi

          echo "POST <deploy hook> (URL hidden — secret)"
          status=$(curl -sS -X POST --retry 3 --retry-delay 5 -o response.json -w '%{http_code}' "$DEPLOY_HOOK_URL")
          echo "HTTP $status"
          case "$status" in
            2*)
              deployment_id=$(jq -er '.result.id' response.json) || {
                echo "::error::Deploy hook response did not include a deployment ID"
                exit 1
              }
              echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
              echo "Cloudflare rebuild triggered for deployment $deployment_id."
              ;;
            *)
              echo "::error::Deploy hook returned HTTP $status (expected 2xx)"
              exit 1
              ;;
          esac

      - name: Wait for deployment and verify production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: node scripts/verify-cloudflare-deployment.mjs "${{ steps.trigger.outputs.deployment_id }}"
