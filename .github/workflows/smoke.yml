name: Smoke Test (production)

# CI in this repo is a pre-deploy gate; Cloudflare Pages builds/deploys from the
# repo directly, so nothing here verifies the *live* site. This job hits the
# deployed URL to catch outages or regressions after they ship.
on:
  schedule:
    # Daily at 07:23 UTC (off the hour to dodge cron congestion). Scheduled runs
    # execute on the default branch.
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Production smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reaches the live site from a GitHub (datacenter) runner. This works only
    # because Cloudflare Bot Fight Mode is OFF for holland.vip — free-plan Bot
    # Fight Mode 403s datacenter IPs and cannot be skipped by any rule or header.
    steps:
      - name: Checkout smoke checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the deployed HTTP contract
        run: npm run smoke:production

      - name: Verify the deployed browser and Analytics contract
        run: npm run smoke:production:browser
